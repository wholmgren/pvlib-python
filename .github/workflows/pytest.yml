name: pytest

on:
  pull_request:
  push:
    branches:
    - main

jobs:
  test:
    strategy:
      fail-fast: false  # don't cancel other matrix jobs when one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        environment-type: [conda, bare]
        suffix: ['']  # placeholder as an alternative to "-min"
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            environment-type: conda
            suffix: -min
        exclude:
          - os: macos-latest
            environment-type: conda
          - os: windows-latest
            environment-type: bare

    runs-on: ${{ matrix.os }}

    steps:
      # We check out only a limited depth and then pull tags to save time
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Get tags
        run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: Install Conda environment with Micromamba
        if: matrix.environment-type == 'conda'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ${{ env.REQUIREMENTS }}
          cache-downloads: false
          cache-environment: false
          create-args: >-
            python=${{ matrix.python-version }}
          condarc: |
            channel-priority: flexible
        env:
          # build requirement filename.  First replacement is for the python
          # version, second is to add "-min" if needed
          REQUIREMENTS: ci/requirements-py${{ matrix.python-version }}${{ matrix.suffix }}.yml

      - name: List installed package versions (conda)
        if: matrix.environment-type == 'conda'
        shell: bash -l {0}  # necessary for conda env to be active
        run: micromamba list

      - name: Install bare Python ${{ matrix.python-version }}${{ matrix.suffix }}
        if: matrix.environment-type == 'bare'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pvlib
        if: matrix.environment-type == 'conda'
        shell: bash -l {0}
        run: python -m pip install --no-deps .

      - name: Set up bare environment
        if: matrix.environment-type == 'bare'
        run: |
          pip install .[test]
          pip freeze

      - name: Run tests
        shell: bash -l {0}  # necessary for conda env to be active
        run: |
          # ignore iotools; those tests are run in a separate workflow
          pytest tests --cov=./ --cov-report=xml --ignore=tests/iotools

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.suffix == '' && matrix.os == 'ubuntu-latest' && matrix.environment-type == 'conda'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          verbose: true
          flags: core  # flags are configured in codecov.yml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  array-libraries:
    # Tests for other array libraries skip the libraries that aren't
    # installed, so this job installs them all, on the CPU. SciPy reads
    # SCIPY_ARRAY_API when imported; an empty value leaves its array API
    # support off.
    name: array libraries (SCIPY_ARRAY_API=${{ matrix.scipy-array-api || 'unset' }})
    strategy:
      fail-fast: false
      matrix:
        scipy-array-api: ['', '1']

    runs-on: ubuntu-latest
    env:
      SCIPY_ARRAY_API: ${{ matrix.scipy-array-api }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pvlib and array libraries
        run: |
          # CPU wheels: PyTorch's default Linux wheels include CUDA
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install .[test] array-api-strict "dask[array]" jax xarray
          pip freeze

      - name: Check that every array library imports
        run: python -c "import array_api_strict, dask.array, jax, torch, xarray"

      - name: Run tests
        # -rs lists skipped tests, which should not include array libraries
        run: pytest tests --ignore=tests/iotools -rs
