name: asv

# CI ASV CHECK is aimed to verify that the benchmarks execute without error.
on:
  push:
    branches:
    - main
  pull_request:


jobs:
  quick-benchmarks:
    # asv makes its environments with conda (benchmarks/asv.conf.json).
    # The ubuntu-26.04 image, which ubuntu-latest is moving to, has no
    # conda on the PATH
    runs-on: ubuntu-24.04
    defaults: 
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asv
        run: pip install asv==0.6.4

      - name: Run asv benchmarks
        run: |
          cd benchmarks
          asv machine --yes
          asv run HEAD^! --quick --dry-run --show-stderr
